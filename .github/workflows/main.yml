name: Main
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3.7.0

      - name: Setup Java
        uses: actions/setup-java@v3.14.2
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and collect coverage
        run: |
          ./gradlew build
          ./gradlew test

      - uses: qltysh/qlty-action/coverage@v2.2.2
        with:
          oidc: true
          files: build/reports/jacoco/test/jacocoTestReport.xml
          add-prefix: src/main/kotlin
